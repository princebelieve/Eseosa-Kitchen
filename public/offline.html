<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eseosa's Kitchen | Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f0e8;
        color: #171717;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 480px;
        background: #fffdf8;
        border: 1px solid #d8d5ca;
        border-radius: 18px;
        padding: 32px 24px;
        box-shadow: 0 16px 36px rgba(23, 34, 29, 0.08);
      }
      h1 { font-size: 2rem; margin: 0 0 12px; }
      p { font-size: 1rem; line-height: 1.6; margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>You can reconnect to enjoy fresh meals from Eseosa's Kitchen again.</p>
    </div>
  </body>
</html>
